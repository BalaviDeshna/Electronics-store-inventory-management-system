{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}
<h2>Edit Product</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <p class="{{ category }}" role="alert">{{ message }}</p>
    {% endfor %}
{% endwith %}

<form method="POST" action="{{ url_for('main.edit_product', product_id=product.id) }}">
    <label for="name">Product name</label>
    <input type="text" id="name" name="name" value="{{ product.name }}" maxlength="200" required>

    <label for="price">Price</label>
    <input type="number" id="price" name="price"
           value="{{ "%.2f"|format(product.price) }}"
           min="0" step="0.01" required>

    <label for="stock">Stock</label>
    <input type="number" id="stock" name="stock"
           value="{{ product.stock }}"
           min="0" step="1" required>

    <button type="submit">Update Product</button>
</form>

<form method="POST" action="{{ url_for('main.delete_product', product_id=product.id) }}" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this product?');">
    <button type="submit">Delete Product</button>
</form>
{% endblock %}
