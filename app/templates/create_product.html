
{% extends "base.html" %}

{% block title %}Create Product{% endblock %}

{% block content %}
<h2>Create Product</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <p class="{{ category }}" role="alert">{{ message }}</p>
    {% endfor %}
{% endwith %}

<form method="POST" action="{{ url_for('main.create_product') }}">
    <label for="name">Product name</label>
    <input type="text" id="name" name="name" maxlength="200" required>

    <label for="sku">SKU</label>
    <input type="text" id="sku" name="sku" maxlength="100">

    <label for="category">Category</label>
    <input type="text" id="category" name="category" maxlength="100">

    <label for="price">Price</label>
    <input type="number" id="price" name="price"
           min="0" step="0.01" required>

    <label for="stock">Initial stock</label>
    <input type="number" id="stock" name="stock"
           min="0" step="1" required>

    <button type="submit">Create Product</button>
</form>
{% endblock %}
